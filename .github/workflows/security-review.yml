name: security-review.yml
on: push

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Execute Backend Security Scanner
        run: |
          node scripts/generateSecuritySuite.js
        env:
          NODE_PATH: node_modules

      - name: Append Reports to GHA Summary
        run: |
          if [ -f executive-summary.md ]; then
            cat executive-summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f dependency-report.md ]; then
            cat dependency-report.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f security-review.md ]; then
            cat security-review.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Enforce Zero-Critical Policy
        run: |
          # Extract Critical count from executive-summary.md using grep & regex
          CRIT_COUNT=$(grep -i "Critical Findings" executive-summary.md | grep -o "[0-9]\+")
          echo "Discovered critical vulnerabilities count: $CRIT_COUNT"
          if [ "$CRIT_COUNT" -gt 0 ]; then
            echo "❌ Zero-Critical Security Gate Failed! Critical Findings count: $CRIT_COUNT"
            exit 1
          else
            echo "✅ Zero-Critical Security Gate Passed! Continuing build..."
          fi
