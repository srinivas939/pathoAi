name: Android E2E — Appium 1111 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 1: Run 1,111 Android Appium mock tests + generate Excel & HTML reports
  # Uses the same Mocha reporter pattern as the web E2E suite (no emulator needed)
  # ──────────────────────────────────────────────────────────────────────────────
  android-e2e-report:
    name: Android Appium E2E (1,111 Tests) + Reports
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Android E2E tests with Excel + HTML reporter
        run: npm run test:android:report

      - name: Verify reports exist
        run: |
          echo "📂 Android report files:"
          ls -lh Test_Results/Android/ || echo "Directory not found"

          # Fail if Excel or HTML report is missing or empty
          if [ ! -s "Test_Results/Android/android-report.xlsx" ]; then
            echo "❌ Excel report is missing or empty!"
            exit 1
          fi
          if [ ! -s "Test_Results/Android/android-execution-report.html" ]; then
            echo "❌ HTML report is missing or empty!"
            exit 1
          fi

          # Show file sizes
          echo "✅ android-report.xlsx: $(du -h Test_Results/Android/android-report.xlsx | cut -f1)"
          echo "✅ android-execution-report.html: $(du -h Test_Results/Android/android-execution-report.html | cut -f1)"

      - name: Show test summary stats
        run: |
          if [ -f "Test_Results/Android/android-stats.json" ]; then
            echo "📊 Android Test Results:"
            cat Test_Results/Android/android-stats.json
          fi

      - name: Generate GitHub Actions Job Summary
        run: node utils/generateSummary.cjs .wdio-results.jsonl || true

      - name: Upload Android test reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-reports-${{ github.run_number }}
          path: |
            Test_Results/Android/android-report.xlsx
            Test_Results/Android/android-execution-report.html
            Test_Results/Android/android-results.json
            Test_Results/Android/android-stats.json
            .wdio-results.jsonl
          retention-days: 30

      # ── Deploy reports to GitHub Pages ─────────────────────────────────────
      - name: Prepare GitHub Pages deploy directory
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p deploy/reports/latest
          mkdir -p deploy/reports/history/android-build-${{ github.run_number }}

          # Copy to latest
          cp Test_Results/Android/android-report.xlsx         deploy/reports/latest/android-report.xlsx
          cp Test_Results/Android/android-execution-report.html deploy/reports/latest/android-execution-report.html

          # Copy to history
          cp Test_Results/Android/android-report.xlsx         deploy/reports/history/android-build-${{ github.run_number }}/android-report.xlsx
          cp Test_Results/Android/android-execution-report.html deploy/reports/history/android-build-${{ github.run_number }}/android-execution-report.html

          echo "📂 Prepared deploy directory:"
          find deploy/ -type f

      - name: Deploy Android reports to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy
          clean: false
          commit-message: "ci: deploy Android Appium E2E reports (run #${{ github.run_number }})"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report deployment links
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## 📱 Android Appium E2E Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Report | Link |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 HTML Execution Report | https://srinivas939.github.io/pathoAi/reports/latest/android-execution-report.html |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Excel Report (.xlsx) | https://srinivas939.github.io/pathoAi/reports/latest/android-report.xlsx |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 History Build | https://srinivas939.github.io/pathoAi/reports/history/android-build-${{ github.run_number }}/ |" >> $GITHUB_STEP_SUMMARY
