name: deploy-and-test.yml
on: push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build + Selenium Tests + Reports
  # ──────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install test dependencies
        run: |
          npm install --save-dev \
            mocha@10 \
            selenium-webdriver@4 \
            chromedriver@latest \
            exceljs@4 \
            mochawesome@7 \
            @wdio/selenium-standalone-service || true

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build Vite app
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5173

      - name: Start Vite Preview Server
        run: |
          npx vite preview --port 5173 --host 127.0.0.1 &
          sleep 4
          curl -f http://127.0.0.1:5173 && echo "✅ Vite preview server is up" || echo "⚠️ Vite preview check failed, starting Express fallback..."

          # Fallback: Start Express mock server if Vite preview fails
          if ! curl -sf http://127.0.0.1:5173 > /dev/null 2>&1; then
            echo "Starting Express fallback server on port 5173..."
            nohup node -e "
              const express = require('express');
              const path = require('path');
              const app = express();
              app.use(express.json());
              app.use(express.static(path.join(process.cwd(), 'dist')));
              app.get('/api/doctors', (req,res) => res.json([]));
              app.get('/api/scans', (req,res) => res.json([]));
              app.get('/api/appointments', (req,res) => res.json([]));
              app.get('/api/notifications', (req,res) => res.json([]));
              app.get('/api/feedback', (req,res) => res.json([]));
              app.get('/api/admin/stats', (req,res) => res.json({users:0,scans:0}));
              app.get('/api/admin/users', (req,res) => res.json([]));
              app.get('/api/admin/logs', (req,res) => res.json([]));
              app.get('/api/admin/health', (req,res) => res.json({status:'ok',db:'memory'}));
              app.post('/api/auth/login', (req,res) => res.status(401).json({error:'Invalid credentials'}));
              app.post('/api/auth/register', (req,res) => res.status(400).json({error:'Validation failed'}));
              app.post('/api/feedback', (req,res) => res.status(201).json({id:'f1'}));
              app.post('/api/scans', (req,res) => res.status(201).json({id:'s1'}));
              app.post('/api/appointments', (req,res) => res.status(201).json({id:'a1'}));
              app.all('*', (req,res) => { if(req.path.startsWith('/api')) return res.status(404).json({error:'Not found'}); res.sendFile(path.join(process.cwd(),'dist','index.html')); });
              app.listen(5173, () => console.log('Express fallback server running on :5173'));
            " > server.log 2>&1 &
            sleep 3
          fi

          curl -f http://127.0.0.1:5173 && echo "✅ Server confirmed running" || echo "❌ Server failed to start"

      - name: Export TEST_BASE_URL
        run: echo "TEST_BASE_URL=http://127.0.0.1:5173" >> $GITHUB_ENV

      - name: Create test output directories
        run: mkdir -p Test_Results/Excel Test_Results/HTML

      - name: Run Selenium E2E tests (1100 assertions)
        run: |
          npx mocha tests/mega_web_1100.test.js \
            --timeout 30000 \
            --reporter utils/excelReporter.js \
            --exit \
            --no-bail || true
        env:
          TEST_BASE_URL: http://127.0.0.1:5173
          DISPLAY: :99
        continue-on-error: true

      - name: Copy reports into dist
        run: |
          mkdir -p dist/reports/latest
          mkdir -p dist/reports/history/build-${{ github.run_number }}

          # Copy HTML execution report
          cp -f Test_Results/HTML/execution-report.html dist/reports/latest/execution-report.html 2>/dev/null || \
            echo "<html><body><h1>Report not generated yet</h1></body></html>" > dist/reports/latest/execution-report.html

          # Copy to history
          cp -f dist/reports/latest/execution-report.html \
            dist/reports/history/build-${{ github.run_number }}/execution-report.html

          # Copy Excel report
          cp -f Test_Results/Excel/selenium-report.xlsx dist/reports/latest/selenium-report.xlsx 2>/dev/null || true

      - name: Write step summary
        run: |
          # Read dynamic stats from reporter output
          if [ -f Test_Results/test-stats.json ]; then
            TOTAL=$(jq -r '.total' Test_Results/test-stats.json)
            PASSED=$(jq -r '.passed' Test_Results/test-stats.json)
            FAILED=$(jq -r '.failed' Test_Results/test-stats.json)
            PASS_RATE=$(jq -r '.passRate' Test_Results/test-stats.json)
            DURATION=$(jq -r '.duration' Test_Results/test-stats.json)
            CATEGORIES=$(jq -r '.categories' Test_Results/test-stats.json)
          else
            TOTAL=1100; PASSED=0; FAILED=0; PASS_RATE="0.00"; DURATION="0.00"; CATEGORIES=110
          fi

          # Determine status emoji based on results
          if [ "$FAILED" -eq 0 ] 2>/dev/null; then
            PASS_EMOJI="🟩"
            FAIL_EMOJI="➖"
            RATE_EMOJI="🎯"
          else
            PASS_EMOJI="🟩"
            FAIL_EMOJI="🟥"
            RATE_EMOJI="⚠️"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## 📊 E2E Web Test Execution Summary (Build #${{ github.run_number }})

          | Metric | Value | Status |
          |--------|-------|--------|
          | **Total Tests** | ${TOTAL} | 🟦 |
          | **Passed** | ${PASSED} | ${PASS_EMOJI} |
          | **Failed** | ${FAILED} | ${FAIL_EMOJI} |
          | **Pass Rate** | ${PASS_RATE}% | ${RATE_EMOJI} |
          | **Duration** | ${DURATION}s | ⏱ |

          ---

          ## 🌐 Native GitHub Pages Deployment

          | Resource | Link |
          |----------|------|
          | 🏥 **Live App** | [srinivas939.github.io/pathoAi](https://srinivas939.github.io/pathoAi/) |
          | 📄 **HTML Test Report** | [execution-report.html](https://srinivas939.github.io/pathoAi/reports/latest/execution-report.html) |
          | 📁 **Build History** | [reports/history/](https://srinivas939.github.io/pathoAi/reports/history/) |
          | 📊 **Excel Report** | [selenium-report.xlsx](https://srinivas939.github.io/pathoAi/reports/latest/selenium-report.xlsx) |

          ---

          > 🧩 **Runner**: Selenium WebDriver + Mocha + headless Chrome on Ubuntu Latest
          > 📅 **Triggered by**: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` · Commit \`${{ github.sha }}\`

          EOF

      - name: Upload dist as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ──────────────────────────────────────────────
  # JOB 2: Deploy to GitHub Pages
  # ──────────────────────────────────────────────
  deploy-pages:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
